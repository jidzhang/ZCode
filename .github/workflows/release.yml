# 桌面端自动发布：push tag v* 触发全平台构建并直传 GitHub Release。
# 行为与设计依据见 specs/ci-release-workflow.md；构建/校验/上传的唯一所有者是
# packages/desktop/scripts/bundle.mjs 与 publish-github-release-asset.mjs，本文件只做编排。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "构建后上传 GitHub Release（必须以发布 tag 作为 ref 运行）"
        type: boolean
        default: false

# tag 推送 = 自动发布；手动触发默认只构建（产物作为 workflow artifacts 上传供装机验证）。
# ZCODE_PUBLISH 是 bundle.mjs 的既有环境变量入参（与 --publish 等价）。必须始终显式给值：
# electron-builder 26 在 CI=true 且缺省 --publish 时默认 onTagOrDraft，
# 手动构建演练若 ref 恰好在 tag 上会触发它自家 GitHub publisher 的缺陷路径（draft 语义/yml 覆盖）。
env:
  ZCODE_ENV: production
  ZCODE_PREVIEW_IDENTITY: "0"
  ZCODE_UPDATE_CHANNEL: github
  ZCODE_UPDATE_GITHUB_REPO: jidzhang/ZCode
  ZCODE_PUBLISH: ${{ (github.event_name == 'push' || inputs.publish == true) && 'always' || 'never' }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
  # runner 在海外，覆盖本地默认的 npmmirror 镜像直连官方源（覆盖路径由 bundle.mjs 既有 env 解析提供）。
  # ELECTRON_MIRROR 尾部不能带 v：@electron/get 会在 mirror 后拼接自带 v 前缀的 customDir（v{version}），
  # 带尾 v 会拼出 .../download/vv41.0.3/ 的 404（首次实跑三平台同挂于此）。
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write

# 同一 ref 的运行不并发互踩（资产上传依赖 --clobber 幂等）；绝不自动取消进行中的发布。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 预建 Release（已发布状态），消除三个平台 job 并发时"查无则建"的竞态窗口。
  # job 本身必须无条件运行（needs 链不能因条件跳过而断掉），是否真正创建由步骤内 if 决定；
  # 预建失败不阻断后续——平台 job 的发布脚本仍会按"不存在则建"兜底。
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release if missing
        if: env.PUBLISH == 'true'
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release create "$TAG" --repo "$ZCODE_UPDATE_GITHUB_REPO" \
            --title "$TAG" --notes "ZCode Desktop $TAG" \
            || echo "[create-release] $TAG 已存在或 tag 尚未创建，交由平台 job 的发布脚本兜底"

  build-windows:
    needs: create-release
    # 2026-11-16：windows-latest（Server 2025）已无 VS2022，prepare:windows-runtime-host 的
    # CMake "Visual Studio 17 2022" 生成器找不到实例（run 43799088154）；钉回自带 VS2022 的
    # windows-2022 镜像。ssh2 的 node-gyp 同源受益。
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        shell: bash
      # 2026-11-16 收窄发布矩阵（用户定案）：win-arm64 无下载量，停发；只构建 x64。
      - run: node packages/desktop/scripts/bundle.mjs --os win --arch x64
        shell: bash
      - name: Upload artifacts (win x64)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-win-x64
          path: packages/desktop/dist/*-win-x64.exe
          retention-days: 7
          if-no-files-found: error

  build-mac:
    needs: create-release
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        shell: bash
      # 2026-11-16 收窄发布矩阵（用户定案）：mac x64 改由 macos12 分支的独立 pre-release
      # 通道承担（Electron 43，macos12-v* tag），本通道只发 arm64。
      # （arm64 在本机原生构建；历史 x64 为交叉构建，与本地跨 arch 打包同一链路。）
      - run: node packages/desktop/scripts/bundle.mjs --os mac --arch arm64
        shell: bash
      - name: Upload artifacts (mac arm64)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-mac-arm64
          path: |
            packages/desktop/dist/*-mac-arm64.dmg
            packages/desktop/dist/*-mac-arm64.zip
          retention-days: 7
          if-no-files-found: error
